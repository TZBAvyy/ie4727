<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaJam Coffee House</title>
    <link rel="stylesheet" href="base.css">
    <script type="module" src="./formvalidation.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>JavaJam Coffee House</h1>
        </header>
        <nav id="left-col">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="music.html">Music</a>
                <a href="jobs.html">Jobs</a>
            </div>
        </nav>
        <div class="content">
            <h2>Jobs at JavaJam</h2>
            <p>Want to work at JavaJam? Fill out the form below to start your application. Required fields are marked with an asterisk *</p>

            <form action="/show_post.php" method="post" id="form">
                <div class="form-item">
                    <label for="name">*Name:</label><br>
                    <input type="text" id="name" name="name" required
                    placeholder="Enter your name here"><br><br>
                </div>

                <div class="form-item">
                    <label for="email">*Email:</label><br>
                    <input type="email" id="email" name="email" required
                    placeholder="Enter your Email-ID here"><br><br>
                </div>

                <div class="form-item">
                    <label for="date">Start Date:</label><br>
                    <input type="date" id="date" name="date" required><br><br>
                </div>

                <div class="form-item">
                    <label for="experience">*Experience:</label><br>
                    <textarea id="experience" name="experience" rows="4" cols="50" required
                    placeholder="Enter your past experience here"></textarea><br><br>
                </div>

                <button>Clear</button><br><br>
                <input type="submit" value="Apply Now">
            </form>
        </div>
        <footer class="footer">
            <small>
                <i>
                    Copyright &copy; 2014 JavaJam Coffee House<br>
        
                </i>
            </small>
            <small>
                <i>
                    <a href="mailto:avisena@gibraltar.com">
                        avisena@gibraltar.com
                    </a>
                </i>
            </small>
        </footer>
    </div>
</body>
</html>
